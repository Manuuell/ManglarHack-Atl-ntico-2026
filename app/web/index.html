<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    `flutter build` reemplaza $FLUTTER_BASE_HREF (por defecto "/"). Si se publica en una subcarpeta,
    compilar con --base-href "/subcarpeta/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <title>Zanky · Guardianes del manglar</title>
  <meta name="description" content="Escanea, mira qué le pasa al manglar del Atlántico y repórtalo desde tu teléfono. Sin instalar nada. Zanky: guardianes del manglar.">
  <meta name="theme-color" content="#0A2A47">
  <meta name="color-scheme" content="light">
  <meta name="application-name" content="Zanky">

  <!-- Al compartir (WhatsApp, Telegram, X, Facebook...).
       TODO al publicar: las imágenes necesitan URL ABSOLUTA (https://tu-dominio/og-zanky.png) para que
       los rastreadores las lean; cambiar og:image, og:url y twitter:image por la dirección real. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CO">
  <meta property="og:site_name" content="Zanky">
  <meta property="og:title" content="Zanky · Guardianes del manglar">
  <meta property="og:description" content="Mira qué le pasa al manglar del Atlántico y repórtalo desde tu teléfono. Sin instalar nada.">
  <meta property="og:image" content="og-zanky.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Zanky, la mascota del manglar, con su corona de hojas sobre un pin de ubicación.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Zanky · Guardianes del manglar">
  <meta name="twitter:description" content="Mira qué le pasa al manglar del Atlántico y repórtalo desde tu teléfono. Sin instalar nada.">
  <meta name="twitter:image" content="og-zanky.png">

  <!-- iOS / Android: instalable y a pantalla completa -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zanky">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- La primera foto de la bienvenida se pide junto al motor: cuando Flutter la necesita ya está en la caché
       del navegador (misma URL y mismo modo que usa Flutter para sus recursos, por eso as="fetch" y crossorigin). -->
  <link rel="preload" href="assets/assets/fotos/manglar-raices-cartagena.webp" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="zanky-arranque.webp" as="image" fetchpriority="high">

  <style>
    html, body { margin: 0; height: 100%; background: #0A2A47; }
    /* Pantalla de carga con identidad CRA: azul profundo, la foto del manglar (una miniatura de 356 bytes
       dentro de esta página, difuminada: se ve en el primer cuadro sin pedir nada a la red) y Zanky. */
    #zk-carga {
      position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; color: #fff; overflow: hidden;
      font-family: Lato, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0A2A47;
      transition: opacity .45s cubic-bezier(.2,.9,.25,1), visibility .45s;
    }
    #zk-carga::before {
      content: ""; position: absolute; inset: -40px; z-index: -2;
      background: url("data:image/webp;base64,UklGRlwBAABXRUJQVlA4IFABAABQBwCdASooABkAPtFaoU2oJSKiKqoBABoJYwC2+4EGi+9phPMeDMthQrFG/+lQAkDX37Z/MesLcF/gEBswqpib26xAAP5749T41qAswusuNmCCYD/E5ecOlYpT61xqSavsXw1cr34D2QLMj9eT5a75yfWDNY/TezxDR95XCNXGZnBPRmgDs/xLliNEvqctmaBcIaE0E+5mFwB3SXYjb+XpbGgXMeHEBqW+XO4ZxXm18uAU9SBlh+WiDK+jmofU57Za8ghBd5gYTSKy8gg4ArDC2wm0WKcThEXdG5kTUGAEWaYfzSBiOgXq0KDI+PcFRGIFftTpitoXrNZUg+EVXciIGHJmMW/68DJKsCDKKP/BbaptFES0nm/Nrh1hdYGQUBpqBuv61btbJUF7+YkiouDWwDpYHnGhMSY527UvKRtGXo5HadJ4Lrk7ykDb5f2aAAA=") center / cover no-repeat;
      filter: blur(18px) saturate(1.1);
    }
    #zk-carga::after {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(180deg, rgba(10,42,71,.55) 0%, rgba(6,30,53,.86) 62%, #061E35 100%);
    }
    #zk-carga.zk-fuera { opacity: 0; visibility: hidden; }
    #zk-carga .zk-mascota { width: 148px; height: 148px; display: block; transform-origin: 50% 100%;
      animation: zk-respira 3.2s ease-in-out infinite; will-change: transform; }
    #zk-carga .zk-sombra { width: 80px; height: 12px; border-radius: 50%; background: rgba(0,0,0,.32); margin-top: -12px;
      animation: zk-sombra 3.2s ease-in-out infinite; }
    #zk-carga .zk-marca { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; text-transform: uppercase; color: #E8B33D; }
    #zk-carga .zk-texto { font-size: 18px; font-weight: 700; letter-spacing: -.1px; text-align: center; max-width: 300px; }
    #zk-carga .zk-barra { width: 148px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
    #zk-carga .zk-barra i { display: block; height: 100%; width: 40%; border-radius: 4px; background: #E8B33D;
      animation: zk-barra 1.4s cubic-bezier(.45,0,.25,1) infinite; }
    #zk-carga .zk-pie { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); font-size: 12px;
      color: rgba(255,255,255,.72); text-align: center; padding: 0 16px; }
    @keyframes zk-respira { 0%,100% { transform: scaleY(1) rotate(-1.2deg); } 50% { transform: scaleY(1.025) rotate(1.2deg); } }
    @keyframes zk-sombra { 0%,100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.94); opacity: .85; } }
    @keyframes zk-barra { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #zk-carga .zk-mascota, #zk-carga .zk-sombra, #zk-carga .zk-barra i { animation: none; }
      #zk-carga { transition: none; }
    }
  </style>
</head>
<body>
  <div id="zk-carga" role="status" aria-live="polite">
    <div class="zk-marca">Zanky · CRA Atlántico</div>
    <!-- Zanky feliz (arte oficial, WebP de 256 px): respira anclado a los pies -->
    <img class="zk-mascota" src="zanky-arranque.webp" width="148" height="148" alt="" decoding="async" fetchpriority="high">
    <div class="zk-sombra"></div>
    <div class="zk-texto" id="zk-carga-texto">Zanky te está abriendo el manglar</div>
    <div class="zk-barra" aria-hidden="true"><i></i></div>
    <div class="zk-pie">Guardianes del manglar del Atlántico</div>
    <noscript><div class="zk-texto" style="max-width:280px;text-align:center">Zanky necesita JavaScript para funcionar. Actívalo en tu navegador y vuelve a abrir esta página.</div></noscript>
  </div>

  <script>
    // Quita la pantalla de carga con un fundido cuando Flutter pinta su primer cuadro.
    (function () {
      var quitada = false;
      function quitar() {
        if (quitada) return;
        quitada = true;
        var el = document.getElementById('zk-carga');
        if (!el) return;
        el.classList.add('zk-fuera');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 600);
      }
      // El evento se lanza en el documento y no burbujea: se escucha en captura desde la ventana.
      // El primer cuadro de Flutter es la espera mientras lee el teléfono (unos cientos de ms) y la foto
      // de la bienvenida se decodifica justo después: se espera un poco para fundir directo a la foto.
      function alPrimerCuadro() { setTimeout(quitar, 650); }
      window.addEventListener('flutter-first-frame', alPrimerCuadro, true);
      document.addEventListener('flutter-first-frame', alPrimerCuadro, true);
      // Si tarda, Zanky lo dice (señal floja en la jornada) en vez de quedarse mudo.
      setTimeout(function () {
        var t = document.getElementById('zk-carga-texto');
        if (t && !quitada) t.textContent = navigator.onLine ? 'La señal está floja, ya casi llego…' : 'Sin señal: abriendo la copia guardada…';
      }, 6000);
      // Red de seguridad: si algo falla, no dejar el fundido tapando para siempre.
      setTimeout(quitar, 25000);
    })();
  </script>
  <!-- defer: pwa.js busca el script de arranque, que va debajo; sin defer no existe aún y el registro falla en silencio. -->
  <script src="pwa.js" defer></script>
  <script id="arranque-flutter" src="flutter_bootstrap.js" async></script>
</body>
</html>
