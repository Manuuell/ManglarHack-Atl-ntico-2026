<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    `flutter build` reemplaza $FLUTTER_BASE_HREF (por defecto "/"). Si se publica en una subcarpeta,
    compilar con --base-href "/subcarpeta/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <title>Zanky · Guardianes del manglar</title>
  <meta name="description" content="Escanea, mira qué le pasa al manglar del Atlántico y repórtalo desde tu teléfono. Sin instalar nada. Zanky: guardianes del manglar.">
  <meta name="theme-color" content="#1FA2A6">
  <meta name="color-scheme" content="light">
  <meta name="application-name" content="Zanky">

  <!-- Al compartir (WhatsApp, Telegram, X, Facebook...).
       TODO al publicar: las imágenes necesitan URL ABSOLUTA (https://tu-dominio/og-zanky.png) para que
       los rastreadores las lean; cambiar og:image, og:url y twitter:image por la dirección real. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CO">
  <meta property="og:site_name" content="Zanky">
  <meta property="og:title" content="Zanky · Guardianes del manglar">
  <meta property="og:description" content="Mira qué le pasa al manglar del Atlántico y repórtalo desde tu teléfono. Sin instalar nada.">
  <meta property="og:image" content="og-zanky.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Zanky, la mascota del manglar, con su corona de hojas sobre un pin de ubicación.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Zanky · Guardianes del manglar">
  <meta name="twitter:description" content="Mira qué le pasa al manglar del Atlántico y repórtalo desde tu teléfono. Sin instalar nada.">
  <meta name="twitter:image" content="og-zanky.png">

  <!-- iOS / Android: instalable y a pantalla completa -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zanky">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #1FA2A6; }
    /* Pantalla de carga: se ve al instante, mientras baja el motor de Flutter. */
    #zk-carga {
      position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 22px; color: #fff; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(120% 90% at 20% 0%, #4cc3c6 0%, #1FA2A6 45%, #12787C 100%);
      transition: opacity .45s cubic-bezier(.2,.9,.25,1), visibility .45s;
    }
    #zk-carga.zk-fuera { opacity: 0; visibility: hidden; }
    #zk-carga .zk-mascota { width: 156px; height: 156px; display: block; transform-origin: 50% 100%;
      animation: zk-respira 3.2s ease-in-out infinite; will-change: transform; }
    #zk-carga .zk-sombra { width: 84px; height: 12px; border-radius: 50%; background: rgba(0,40,44,.28); margin-top: -10px;
      animation: zk-sombra 3.2s ease-in-out infinite; }
    #zk-carga .zk-texto { font-size: 17px; font-weight: 600; letter-spacing: -.1px; }
    #zk-carga .zk-puntos span { animation: zk-punto 1.2s infinite both; }
    #zk-carga .zk-puntos span:nth-child(2) { animation-delay: .15s; }
    #zk-carga .zk-puntos span:nth-child(3) { animation-delay: .3s; }
    @keyframes zk-respira { 0%,100% { transform: scaleY(1) rotate(-1.2deg); } 50% { transform: scaleY(1.025) rotate(1.2deg); } }
    @keyframes zk-sombra { 0%,100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.94); opacity: .85; } }
    @keyframes zk-punto { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #zk-carga .zk-mascota, #zk-carga .zk-sombra, #zk-carga .zk-puntos span { animation: none; }
      #zk-carga { transition: none; }
    }
  </style>
</head>
<body>
  <div id="zk-carga" role="status" aria-live="polite">
    <!-- Zanky feliz (arte oficial, WebP de 256 px): respira anclado a los pies -->
    <img class="zk-mascota" src="zanky-arranque.webp" width="156" height="156" alt="" decoding="async" fetchpriority="high">
    <div class="zk-sombra"></div>
    <div class="zk-texto">Cargando el manglar<span class="zk-puntos"><span>.</span><span>.</span><span>.</span></span></div>
    <noscript><div class="zk-texto" style="max-width:280px;text-align:center">Zanky necesita JavaScript para funcionar. Actívalo en tu navegador y vuelve a abrir esta página.</div></noscript>
  </div>

  <script>
    // Quita la pantalla de carga con un fundido cuando Flutter pinta su primer cuadro.
    (function () {
      var quitada = false;
      function quitar() {
        if (quitada) return;
        quitada = true;
        var el = document.getElementById('zk-carga');
        if (!el) return;
        el.classList.add('zk-fuera');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 600);
      }
      // El evento se lanza en el documento y no burbujea: se escucha en captura desde la ventana.
      window.addEventListener('flutter-first-frame', quitar, true);
      document.addEventListener('flutter-first-frame', quitar, true);
      // Red de seguridad: si algo falla, no dejar el fundido tapando para siempre.
      setTimeout(quitar, 25000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
