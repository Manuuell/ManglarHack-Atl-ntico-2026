name: zanky
description: "Zanky: monitoreo ciudadano del manglar del Atlántico (Manglar Hack Atlántico 2026)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Mapa base de OpenStreetMap y polígonos del manglar.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # GPS del teléfono: funciona sin internet.
  geolocator: ^14.0.1
  # Foto de la evidencia (cámara primero).
  image_picker: ^1.2.4
  # Cola de reportes y perfil guardados en el teléfono.
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  http: ^1.6.0
  # Id del reporte generado en el teléfono: reintentar sin señal nunca duplica.
  uuid: ^4.6.0
  # Huella de la foto (fotos recicladas) y de la cédula (nunca se guarda en claro).
  crypto: ^3.0.8
  connectivity_plus: ^7.3.2
  flutter_animate: ^4.5.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  # IndexedDB: las fotos de los reportes pendientes en la web (localStorage solo da ~5 MB).
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  shared_preferences_platform_interface: any
flutter:
  uses-material-design: true

  assets:
    - assets/datos/
    - assets/zanky/
    - assets/zanky/etapas/
    - assets/marca/

  # Lato (licencia OFL, assets/fuentes/OFL.txt) va dentro de la app: en el manglar no hay señal
  # para bajar fuentes. Los pesos 500 y 600 caen en el 400 y el 700 más cercanos.
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fuentes/Lato-Regular.ttf
          weight: 400
        - asset: assets/fuentes/Lato-Bold.ttf
          weight: 700
        - asset: assets/fuentes/Lato-Black.ttf
          weight: 900
